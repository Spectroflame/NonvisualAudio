name: Build desktop apps

on:
  workflow_dispatch:
    inputs:
      test_marker:
        description: 'Pre-release marker for a tester build (e.g. rc1, beta2). Empty = plain build. Stamped onto the artifact version only; never committed and no release/tag is created.'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

# The release step needs write access to create a GitHub Release; the
# per-platform jobs only need read access.
permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------ #
  # macOS — single universal2 (fat) bundle that runs natively on
  # Apple Silicon and Intel. The previous matrix row for macos-13
  # (Intel) was unreliable: GitHub's public Intel runner pool is
  # essentially drained, the x86_64 job sat in queue for >1h on the
  # last release and was eventually cancelled. Building universal2
  # on the macos-14 (arm64) runner sidesteps the queue entirely.
  #
  # Three things have to be universal2 for the resulting .app to
  # actually run on both architectures:
  #
  #  - The Python interpreter. actions/setup-python only ships
  #    single-arch builds, so we install the python.org installer,
  #    which is the canonical universal2 (fat) interpreter.
  #  - Every native .so / .dylib loaded at import time. numpy, scipy,
  #    wxPython, soundfile, and sounddevice all publish universal2
  #    wheels on PyPI for current versions; pip picks them
  #    automatically because the running interpreter is universal2.
  #  - The bundled ffmpeg. We lipo together two STATICALLY linked
  #    builds (x86_64 from evermeet.cx, arm64 from martin-riedl.de).
  #    Homebrew's ffmpeg is dynamically linked against ~50 Cellar
  #    dylibs that never reach the .app — shipping it broke the
  #    loudness scan on every Mac without Homebrew.
  # ------------------------------------------------------------------ #
  macos:
    name: macOS Universal2
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install python.org universal2 Python 3.12
        # actions/setup-python's macOS cache holds an arm64-only build
        # which would silently produce a single-arch bundle. The
        # python.org installer is the only mainstream universal2
        # Python distribution, so we install it directly.
        run: |
          set -eux
          PY_VERSION=3.12.8
          curl -fL --retry 3 -o /tmp/python.pkg \
            "https://www.python.org/ftp/python/${PY_VERSION}/python-${PY_VERSION}-macos11.pkg"
          sudo installer -pkg /tmp/python.pkg -target /
          PY_BIN=/Library/Frameworks/Python.framework/Versions/3.12/bin
          echo "${PY_BIN}" >> "$GITHUB_PATH"
          # Fail loudly if the interpreter isn't a fat binary —
          # a stealth single-arch install would only surface as a
          # broken .app on Intel users' machines otherwise.
          file "${PY_BIN}/python3.12" | tee /tmp/python_arch.txt
          grep -q "x86_64" /tmp/python_arch.txt
          grep -q "arm64" /tmp/python_arch.txt

      - name: Sync version with pushed git tag
        if: startsWith(github.ref, 'refs/tags/v')
        # Write the tag's version number (without the leading v) into
        # pyproject.toml so the About dialog, CFBundleShortVersionString,
        # and every artifact match the GitHub release tag exactly.
        run: python3.12 scripts/bump_version.py "${GITHUB_REF_NAME}" --no-reinstall

      - name: Stamp tester pre-release marker
        # Manual tester builds only: append the dispatch marker (e.g. rc1)
        # to the branch's plain version so the artifact reads 2.1.0rc1
        # while the committed version stays 2.1.0. Must run before the
        # dependency install below bakes the version into the dist metadata.
        if: github.event_name == 'workflow_dispatch' && inputs.test_marker != ''
        env:
          TEST_MARKER: ${{ inputs.test_marker }}
        run: python3.12 scripts/bump_version.py --marker "$TEST_MARKER" --no-reinstall

      - name: Install Python dependencies (universal2 via delocate-merge)
        # numpy, scipy and several others stopped publishing universal2
        # wheels on PyPI a while back — they ship arm64 and x86_64
        # wheels separately to keep download sizes reasonable. So a
        # single `pip install --platform=universal2 --only-binary=:all:`
        # cannot resolve them. Instead we download each native dep
        # twice (once per arch), fuse the two wheels into one
        # universal2 wheel with delocate-merge (which lipo-merges the
        # internal .so / .dylib payloads), and install from the fused
        # wheelhouse. PyInstaller then sees fat binaries everywhere
        # and the universal2 build succeeds.
        run: |
          set -eux
          python3.12 -m pip install --upgrade pip
          python3.12 -m pip install delocate

          PACKAGES="wxPython numpy scipy soundfile sounddevice pyloudnorm cffi"
          mkdir -p /tmp/whl/arm64 /tmp/whl/x86_64 /tmp/whl/universal2

          # We resolve the x86_64 wheels FIRST because they are the
          # more constrained arch — newer scipy / numpy releases
          # have started skipping x86_64 builds, so whatever pip
          # picks here is the latest version that still ships both
          # an arm64 AND an x86_64 wheel. The arm64 download then
          # gets pinned to those exact versions; otherwise pip
          # happily resolves arm64 to a newer release (scipy 1.17.x
          # was the first casualty), no x86_64 counterpart exists,
          # and delocate-merge has nothing to fuse.
          #
          # The platform tags are deliberately permissive ceilings
          # ("we'll accept anything older than this"). The wheel's
          # own embedded LC_BUILD_VERSION is what ends up in the
          # shipped bundle, so widening the ceiling doesn't raise
          # the runtime requirement on user machines.
          python3.12 -m pip download \
            --platform=macosx_10_13_x86_64 \
            --python-version=312 \
            --only-binary=:all: \
            -d /tmp/whl/x86_64 \
            ${PACKAGES}

          PINS=""
          for whl in /tmp/whl/x86_64/*.whl; do
            base=$(basename "${whl}" .whl)
            dist=$(echo "${base}" | cut -d- -f1)
            version=$(echo "${base}" | cut -d- -f2)
            PINS="${PINS} ${dist}==${version}"
          done
          echo "Pinning arm64 download to: ${PINS}"

          python3.12 -m pip download \
            --platform=macosx_14_0_arm64 \
            --python-version=312 \
            --only-binary=:all: \
            -d /tmp/whl/arm64 \
            ${PINS}

          # Pair each arm64 wheel with its x86_64 counterpart, fuse
          # into a universal2 wheel. Pure-Python wheels (no arch
          # suffix in the filename) and any wheel that already ships
          # as universal2 are copied through unchanged.
          for whl in /tmp/whl/arm64/*.whl; do
            name=$(basename "${whl}")
            if [[ "${name}" == *_arm64.whl ]]; then
              stem=$(echo "${name}" | sed -E 's/-macosx_[0-9_]+_arm64\.whl$//')
              x64=$(ls /tmp/whl/x86_64/${stem}-macosx_*_x86_64.whl 2>/dev/null | head -1 || true)
              if [ -n "${x64}" ]; then
                delocate-merge "${whl}" "${x64}" -w /tmp/whl/universal2/
              else
                echo "::warning::no x86_64 counterpart for ${name}, copying arm64-only"
                cp "${whl}" /tmp/whl/universal2/
              fi
            else
              cp -n "${whl}" /tmp/whl/universal2/ || true
            fi
          done
          # Pick up any wheels that arrived only via the x86_64
          # download (rare, but possible for arch-asymmetric trees).
          for whl in /tmp/whl/x86_64/*.whl; do
            name=$(basename "${whl}")
            if [[ "${name}" != *_x86_64.whl ]]; then
              cp -n "${whl}" /tmp/whl/universal2/ || true
            fi
          done

          ls -la /tmp/whl/universal2/

          python3.12 -m pip install \
            --no-index \
            --find-links=/tmp/whl/universal2 \
            --upgrade \
            ${PACKAGES}
          python3.12 -m pip install --no-deps -e .
          python3.12 -m pip install pyinstaller

      - name: Bundle universal2 ffmpeg (static, self-contained)
        # Both slices come from STATICALLY linked ffmpeg builds, so the
        # fused binary has no @rpath dependencies and runs on any Mac
        # without Homebrew.
        #
        # The previous step used `brew install ffmpeg`, which is
        # dynamically linked against ~50 Cellar dylibs. Those dylibs
        # never made it into the .app, so the shipped ffmpeg failed to
        # launch with "Library not loaded: @rpath/libav*.dylib" on every
        # machine without a matching Homebrew install — the 2.0.2
        # Intel-Mac loudness-scan failure.
        #
        #  - x86_64: evermeet.cx static build, resolved via its JSON
        #    /info API so no version-stamped filename is hard-coded.
        #  - arm64:  ffmpeg.martin-riedl.de static build; /redirect/latest
        #    is a stable URL that 307s to the current release.
        #
        # `lipo -create` fuses the two Mach-O slices into one fat binary.
        run: |
          set -eux
          mkdir -p /tmp/ff/x86_64 /tmp/ff/arm64

          X86_URL=$(curl -fsSL --retry 3 \
            https://evermeet.cx/ffmpeg/info/ffmpeg/release \
            | python3.12 -c 'import json,sys; print(json.load(sys.stdin)["download"]["zip"]["url"])')
          curl -fsSL --retry 3 -o /tmp/ff/x86_64.zip "${X86_URL}"
          unzip -o /tmp/ff/x86_64.zip -d /tmp/ff/x86_64
          X86_FFMPEG=$(find /tmp/ff/x86_64 -type f -name ffmpeg | head -1)

          curl -fsSL --retry 3 -o /tmp/ff/arm64.zip \
            https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffmpeg.zip
          unzip -o /tmp/ff/arm64.zip -d /tmp/ff/arm64
          ARM64_FFMPEG=$(find /tmp/ff/arm64 -type f -name ffmpeg | head -1)

          # Each slice must be the expected arch AND self-contained:
          # no @rpath or Homebrew-prefix dylib references. A dynamically
          # linked binary slipping through here is exactly the bug this
          # step exists to prevent, so fail the build loudly.
          file "${X86_FFMPEG}"   | grep -q x86_64
          file "${ARM64_FFMPEG}" | grep -q arm64
          for f in "${X86_FFMPEG}" "${ARM64_FFMPEG}"; do
            if otool -L "$f" | tail -n +2 | grep -Ev '^\s+(/System/|/usr/lib/)'; then
              echo "::error::${f} has non-system dylib dependencies — not static"
              exit 1
            fi
          done

          mkdir -p src/nonvisualaudio/resources/bin/darwin
          lipo -create -output src/nonvisualaudio/resources/bin/darwin/ffmpeg \
            "${X86_FFMPEG}" "${ARM64_FFMPEG}"
          chmod +x src/nonvisualaudio/resources/bin/darwin/ffmpeg
          file src/nonvisualaudio/resources/bin/darwin/ffmpeg | tee /tmp/ffmpeg_arch.txt
          grep -q "x86_64" /tmp/ffmpeg_arch.txt
          grep -q "arm64" /tmp/ffmpeg_arch.txt

      - name: Build .app bundle (universal2)
        # The fat-binary toggle lives in NonvisualAudio.spec
        # (target_arch="universal2" on darwin). PyInstaller refuses
        # --target-architecture when a .spec file is supplied — that
        # flag is makespec-only — so we rely solely on the spec.
        run: pyinstaller --clean --noconfirm NonvisualAudio.spec

      - name: Splice arm64 slice into x86_64-only dylibs
        # numpy on Apple Silicon uses Apple's Accelerate framework
        # instead of bundling libgfortran / libquadmath / libgcc_s; on
        # Intel it bundles them. delocate-merge cannot fuse a file
        # that exists in only one of the two source wheels, so the
        # merged universal2 numpy wheel ships those runtime dylibs
        # as x86_64-only inside numpy/.dylibs/.
        #
        # PyInstaller's COLLECT step then plants a flattened symlink
        # at Contents/Frameworks/libgfortran.5.dylib pointing into
        # numpy/.dylibs/. When scipy's universal2 .so files load
        # @rpath/libgfortran.5.dylib at runtime on arm64, dyld
        # follows that symlink to numpy's x86_64-only copy and the
        # load fails with "incompatible architecture", crashing the
        # app at startup with no window and no error visible to a
        # Finder-launched user.
        #
        # scipy ships its own libgfortran (and friends) on both
        # arches, so the merged scipy/.dylibs/libgfortran.5.dylib IS
        # universal2. The arm64 slice in there is ABI-compatible with
        # numpy's copy (same compatibility version, same gfortran
        # release cycle), so we splice it into each x86_64-only
        # sibling. lipo concatenates the slices verbatim — each slice
        # keeps its own install_name and dependency table, dyld just
        # picks the slice that matches the running architecture.
        run: |
          set -euxo pipefail
          APP=dist/NonvisualAudio.app
          WORK=$(mktemp -d)

          file_archs() {
            lipo -info "$1" 2>/dev/null | sed -E 's/^.*: //'
          }

          is_x86_64_only() {
            local archs
            archs=$(file_archs "$1") || return 1
            case "$archs" in
              *arm64*) return 1 ;;
              *x86_64*) return 0 ;;
              *) return 1 ;;
            esac
          }

          while IFS= read -r lib; do
            is_x86_64_only "$lib" || continue
            name=$(basename "$lib")
            sibling=""
            while IFS= read -r candidate; do
              [ "$candidate" = "$lib" ] && continue
              case "$(file_archs "$candidate")" in
                *arm64*) sibling="$candidate"; break ;;
              esac
            done < <(find "$APP" -type f -name "$name")
            if [ -z "$sibling" ]; then
              echo "::warning::no arm64 sibling for x86_64-only ${lib#$APP/}"
              continue
            fi
            slice="$WORK/${name}.arm64"
            lipo "$sibling" -thin arm64 -output "$slice"
            lipo "$lib" "$slice" -create -output "${lib}.fat"
            mv "${lib}.fat" "$lib"
            echo "spliced arm64 from ${sibling#$APP/} into ${lib#$APP/}"
          done < <(find "$APP" -type f \( -name "*.dylib" -o -name "*.so" \))

      - name: Ad-hoc code sign
        # Ad-hoc signing is enough for local execution; users still need
        # to clear the quarantine attribute on first launch (documented
        # in the README).
        run: codesign --force --deep --sign - dist/NonvisualAudio.app

      - name: Verify the bundle is universal2 and ffmpeg is self-contained
        # If a single .so in the dependency chain ever gets pulled in
        # arm64-only the .app would silently degrade to "arm64 with
        # arm64-only Python sub-bundles" and break on Intel users.
        # Surface that here, not in a bug report.
        run: |
          set -eux
          file dist/NonvisualAudio.app/Contents/MacOS/NonvisualAudio | tee /tmp/exe_arch.txt
          grep -q "x86_64" /tmp/exe_arch.txt
          grep -q "arm64" /tmp/exe_arch.txt

          # The bundled ffmpeg is the part that broke on Intel in 2.0.2:
          # a dynamically linked binary whose dylibs were not in the
          # .app. Verify it is universal2, has no non-system dylib
          # dependencies, and genuinely launches under both architectures
          # (Rosetta covers x86_64 on the arm64 runner).
          FF=dist/NonvisualAudio.app/Contents/Frameworks/nonvisualaudio/resources/bin/darwin/ffmpeg
          file "$FF" | tee /tmp/ff_arch.txt
          grep -q "x86_64" /tmp/ff_arch.txt
          grep -q "arm64" /tmp/ff_arch.txt
          # otool -L on a fat binary repeats the listing once per
          # architecture, each block prefixed with an unindented
          # "<path> (architecture X):" header. Keep only the indented
          # dependency lines, then anything that is not /System or
          # /usr/lib is a real non-system dependency.
          if otool -L "$FF" | grep -E '^[[:space:]]' \
               | grep -Ev '^[[:space:]]+(/System/|/usr/lib/)'; then
            echo "::error::bundled ffmpeg has non-system dylib dependencies"
            exit 1
          fi
          arch -arm64  "$FF" -version | head -1
          arch -x86_64 "$FF" -version | head -1

      - name: Package as zip
        # Ship the .app alongside a first-launch helper (clears the
        # quarantine xattr and opens the app) and a short readme, wrapped in
        # a NonvisualAudio/ folder. Only sibling files are added next to the
        # ad-hoc-signed bundle, so its signature stays intact.
        run: |
          set -eux
          STAGE=dist/pkg/NonvisualAudio
          mkdir -p "$STAGE"
          ditto dist/NonvisualAudio.app "$STAGE/NonvisualAudio.app"
          cp "packaging/macos/NonvisualAudio starten (Erststart).command" "$STAGE/"
          cp packaging/macos/LIESMICH.txt "$STAGE/"
          chmod +x "$STAGE/NonvisualAudio starten (Erststart).command"
          ditto -c -k --sequesterRsrc --keepParent "$STAGE" dist/NonvisualAudio-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: NonvisualAudio-macOS
          path: dist/NonvisualAudio-macOS.zip
          if-no-files-found: error

  # ------------------------------------------------------------------ #
  # Windows x64.
  # ------------------------------------------------------------------ #
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync version with pushed git tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: python scripts/bump_version.py "$env:GITHUB_REF_NAME" --no-reinstall

      - name: Stamp tester pre-release marker
        if: github.event_name == 'workflow_dispatch' && inputs.test_marker != ''
        shell: pwsh
        env:
          TEST_MARKER: ${{ inputs.test_marker }}
        run: python scripts/bump_version.py --marker "$env:TEST_MARKER" --no-reinstall

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Bundle static ffmpeg
        shell: pwsh
        # Resolve the win64-gpl asset URL through the GitHub API
        # rather than guessing the filename. BtbN bumps the "latest"
        # release regularly and has historically renamed the asset
        # (e.g. dropping the "-master-" segment), which silently
        # breaks a hard-coded /releases/latest/download/<file> URL.
        # The API call is cheap and self-healing.
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ 'User-Agent' = 'NonvisualAudio-build' }
          if ($env:GITHUB_TOKEN) {
            $headers['Authorization'] = "Bearer $env:GITHUB_TOKEN"
          }
          $release = Invoke-RestMethod -Headers $headers `
            -Uri 'https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/latest'
          $asset = $release.assets |
            Where-Object { $_.name -match '^ffmpeg-.*-win64-gpl(?!-shared).*\.zip$' } |
            Select-Object -First 1
          if (-not $asset) {
            throw "No win64-gpl asset found in BtbN/FFmpeg-Builds release '$($release.tag_name)'"
          }
          Write-Host "Downloading $($asset.name) from $($asset.browser_download_url)"
          $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'ffmpeg'
          Invoke-WebRequest -Headers $headers -Uri $asset.browser_download_url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $exe = Get-ChildItem -Path $extract -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $exe) { throw 'ffmpeg.exe not found in downloaded archive' }
          New-Item -ItemType Directory -Force -Path src\nonvisualaudio\resources\bin\win | Out-Null
          Copy-Item $exe.FullName src\nonvisualaudio\resources\bin\win\ffmpeg.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build .exe folder
        run: pyinstaller --clean --noconfirm NonvisualAudio.spec

      - name: Package as zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist\NonvisualAudio `
            -DestinationPath dist\NonvisualAudio-Windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: NonvisualAudio-Windows-x64
          path: dist/NonvisualAudio-Windows-x64.zip
          if-no-files-found: error

  # ------------------------------------------------------------------ #
  # Linux x64 (Ubuntu 22.04).
  #
  # wxPython has no Linux wheel on PyPI, so we pull it from the
  # official extras index that matches the runner's distribution.
  # ------------------------------------------------------------------ #
  linux:
    name: Linux x64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync version with pushed git tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: python scripts/bump_version.py "${GITHUB_REF_NAME}" --no-reinstall

      - name: Stamp tester pre-release marker
        if: github.event_name == 'workflow_dispatch' && inputs.test_marker != ''
        env:
          TEST_MARKER: ${{ inputs.test_marker }}
        run: python scripts/bump_version.py --marker "$TEST_MARKER" --no-reinstall

      - name: Install system libraries needed by wxPython
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-0 \
            libsdl2-2.0-0 \
            libnotify4 \
            libsm6 \
            libxxf86vm1 \
            libgstreamer1.0-0 \
            libgstreamer-plugins-base1.0-0 \
            libwebkit2gtk-4.0-37

      - name: Install Python dependencies (wxPython from extras index)
        # wxPython has no manylinux wheel on PyPI — only the extras
        # index ships prebuilt Linux wheels. The original step gave up
        # after the default 15 s read timeout, so a brief blip on
        # extras.wxpython.org killed the whole release. We now retry
        # with a generous timeout, which absorbs transient outages.
        #
        # --only-binary=wxPython is a deliberate guard: if the wheel
        # genuinely cannot be fetched, pip fails fast and clearly here
        # instead of silently attempting a source build that would
        # only collapse ~25 minutes later on missing GTK dev headers.
        # A sustained outage is rare and best handled by re-running.
        run: |
          python -m pip install --upgrade pip
          pip install --retries 5 --timeout 120 -U \
            --only-binary=wxPython \
            -f https://extras.wxpython.org/wxPython4/extras/linux/gtk3/ubuntu-22.04 \
            wxPython
          pip install --retries 5 --timeout 120 \
            numpy scipy soundfile sounddevice pyloudnorm
          pip install --no-deps -e .
          pip install pyinstaller

      - name: Bundle static ffmpeg
        run: |
          set -eux
          curl -L --fail \
            https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz \
            -o /tmp/ffmpeg.tar.xz
          mkdir -p /tmp/ffmpeg-extract
          tar -xJf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg-extract --strip-components=1
          mkdir -p src/nonvisualaudio/resources/bin/linux
          cp /tmp/ffmpeg-extract/ffmpeg src/nonvisualaudio/resources/bin/linux/ffmpeg
          chmod +x src/nonvisualaudio/resources/bin/linux/ffmpeg

      - name: Build executable folder
        run: pyinstaller --clean --noconfirm NonvisualAudio.spec

      - name: Package as tar.gz
        run: |
          cd dist
          tar -czf NonvisualAudio-Linux-x64.tar.gz NonvisualAudio

      - uses: actions/upload-artifact@v4
        with:
          name: NonvisualAudio-Linux-x64
          path: dist/NonvisualAudio-Linux-x64.tar.gz
          if-no-files-found: error

  # ------------------------------------------------------------------ #
  # Attach the three artifacts (macOS universal2, Windows x64, Linux
  # x64) to a GitHub Release when a v* tag is pushed. Manual
  # (workflow_dispatch) runs skip this step.
  # ------------------------------------------------------------------ #
  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts into one directory
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' \) \
            -exec cp {} release-files/ \;
          ls -la release-files

      - uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
          # Tags carrying a pre-release suffix (e.g. v2.1.0-rc.1) publish as
          # a prerelease so they never displace the stable "Latest" release;
          # a clean tag (v2.1.0) publishes as a normal release.
          prerelease: ${{ contains(github.ref_name, '-') }}
