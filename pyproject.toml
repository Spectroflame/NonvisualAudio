[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nonvisualaudio"
version = "2.1.0"
description = "Accessible audio analyzer for blind and low-vision audio professionals."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "NonvisualAudio" }]
dependencies = [
    "wxPython>=4.2",
    "sounddevice>=0.4",
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=7", "briefcase>=0.3.17"]

[project.scripts]
nonvisualaudio = "nonvisualaudio.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nonvisualaudio = [
    "resources/bin/**/*",
    "resources/**/*.json",
    "resources/**/*.html",
]
